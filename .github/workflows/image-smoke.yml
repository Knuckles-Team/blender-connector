name: image-smoke

# CONN-BLENDER-CONNECTOR-R018: build both images, start the compose bundle with no GPU and prove
# the scene round trip through the connector. The images are built from the files the shared
# pipeline renders; the connector image installs the wheel built from this checkout.
on:
  pull_request:
    paths:
      - pyproject.toml
      - image/**
      - deploy/**
      - scripts/smoke_images.py
      - .github/workflows/image-smoke.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - image/**
      - deploy/**
      - scripts/smoke_images.py
      - .github/workflows/image-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build the wheel and render the image files
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          uvx --from "git+https://github.com/Knuckles-Team/pipelines@main" pipelines-connector render --root . --out docker
          # The rendered connector image installs the release from the package index; install the
          # wheel built here instead, from a named build context.
          sed -i 's|^FROM builder-base AS builder-mcp$|&\nCOPY --from=wheelhouse . /wheelhouse|; s|uv pip install --system|uv pip install --find-links /wheelhouse --system|' docker/Dockerfile
      - name: Build the connector image
        run: docker build --target mcp --build-context wheelhouse=dist -f docker/Dockerfile -t smoke-connector .
      - name: Build the Blender image
        run: docker build -f docker/blender.Dockerfile -t smoke-blender .
      - name: Start both containers without a GPU
        env:
          BLENDER_IMAGE: smoke-blender
          CONNECTOR_IMAGE: smoke-connector
        run: docker compose -f deploy/compose.yml up -d
      - name: Assert the scene round trip
        run: uv run --no-project --with fastmcp python scripts/smoke_images.py
      - name: Show the container logs
        if: failure()
        env:
          BLENDER_IMAGE: smoke-blender
          CONNECTOR_IMAGE: smoke-connector
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: Stop the containers
        if: always()
        env:
          BLENDER_IMAGE: smoke-blender
          CONNECTOR_IMAGE: smoke-connector
        run: docker compose -f deploy/compose.yml down -v
