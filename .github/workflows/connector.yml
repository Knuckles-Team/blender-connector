name: connector

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Sync locked environment
        run: uv sync --all-extras --group dev
      - name: Pre-commit gate
        run: uvx pre-commit run --all-files
      - name: Test suite
        run: uv run pytest tests -q
      - name: Content drift gate
        run: uv run python scripts/generate_blender_content.py --check
